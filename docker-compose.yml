# Development services. Only binds to localhost.
#   docker compose up -d db
services:
  db:
    image: postgres:18
    container_name: kivi-ui-db
    environment:
      POSTGRES_USER: kivi
      POSTGRES_PASSWORD: kivi
      POSTGRES_DB: kivi
    ports:
      - "127.0.0.1:${KIVI_PG_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kivi -d kivi"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
